on:
  push:
    branches:
    - main

jobs:
  build:
    name: Building project with npm install then npm build
    runs-on: ubuntu-latest
    steps:
      #copy the repo into the runner so the workflow can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
      - run: |
         set -e
         npm install
         npm run build
      #upload as an artifact for the deploy job to download and push to the deploy repo
      - uses: actions/upload-artifact@v4
        with:
           name: dist-files
           path: dist/          
  deployment:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist-files
        path: dist/
    - name: configure git
      run: |
        git config --global user.name "${{secrets.USERNAME}}"
        git config --global user.email "${{secrets.EMAIL}}"
    - name: push to other repo
      run: |
          cd dist
          git init
          git add -A
          git commit -m "deploy"
          git branch -M main
          git remote add origin https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/AliMousa27/AliMousa27.github.io.git
          echo "ADDED REMOTE ORIGIN"
          git push -u -f origin main
  
  
