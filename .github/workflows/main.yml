on:
  push:
    branches:
    - main

jobs:
  build:
    name: Building project with npm install then npm build
    runs-on: ubuntu-latest
    steps:
      #copy the repo into the runner so the workflow can access it
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.15.0'
      - run: |
         npm install
         npm run build
    
  
